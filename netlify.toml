[build]
  command = "cd astro && npm ci && npm run build"
  publish = "astro/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22.14.0"
  ASTRO_TELEMETRY_DISABLED = "1"

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200
  force = true

[[redirects]]
  from = "/api/leads/*"
  to = "/.netlify/functions/leads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # CSP notes (Google tag platform — developers.google.com/tag-platform/security/guides/csp):
    # - script/img/connect googleadservices.com = Google Ads conversion ping (second path besides googleads.g.doubleclick.net)
    # - frame-src td.doubleclick.net = Ads cross-domain conversion linker iframe
    # - frame-src + connect-src www.googletagmanager.com = Tag Assistant / GTM preview debug channel
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self' https://api.thrivewellnessth.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.googleadservices.com https://www.google.com https://challenges.cloudflare.com https://googleads.g.doubleclick.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://qr-official.line.me https://cdn.sanity.io https://www.google-analytics.com https://www.googleadservices.com https://www.google.com https://www.google.co.th https://googleads.g.doubleclick.net; connect-src 'self' https://api.thrivewellnessth.com https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://www.googleadservices.com https://www.google.com https://googleads.g.doubleclick.net https://ad.doubleclick.net https://stats.g.doubleclick.net; frame-src https://challenges.cloudflare.com https://td.doubleclick.net https://www.googletagmanager.com; upgrade-insecure-requests"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
