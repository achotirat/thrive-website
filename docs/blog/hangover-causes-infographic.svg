      <path d="M111 121H202" stroke="#DDA75E" stroke-width="4" stroke-linecap="round"/>
      <text x="383" y="35" fill="#CDA36D" font-size="15" font-weight="700">03</text>
    </g>

    <g transform="translate(512 368)">
      <rect width="424" height="178" rx="18" fill="#FFFFFF" stroke="#DEE4E5" stroke-width="2"/>
      <rect x="20" y="23" width="70" height="70" rx="17" fill="#F3F5F5"/>
      <g transform="translate(55 58)" fill="none" stroke="#87989B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
